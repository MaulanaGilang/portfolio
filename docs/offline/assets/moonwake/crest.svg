<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" role="img" aria-labelledby="t">
  <title id="t">House Maulana of Moonwake: a silver crescent, horns down, arching over a full silver moon, in a wine-red circle with a thin black border</title>
  <defs>
    <mask id="cut" maskUnits="userSpaceOnUse">
      <rect width="400" height="400" fill="#fff"/>
      <circle cx="200" cy="245" r="62" fill="#000"/>
    </mask>
  </defs>
  <circle cx="200" cy="200" r="141" fill="#5A0F1E" stroke="#000" stroke-width="4"/>
  <!-- The crescent over the pool: crescent top at y 115, moon bottom at y 285, centred in the circle. -->
  <circle cx="200" cy="205" r="90" fill="#C9CDD3" mask="url(#cut)"/>
  <circle cx="200" cy="245" r="40" fill="#C9CDD3"/>
</svg>
